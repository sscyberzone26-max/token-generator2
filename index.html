<style>
/* Compact live-token layout */

<script>
(function(){
  const PER_PAGE = 15;
  let currentPage = 1;
  let rows = [];
  const body = document.getElementById('tableBody');
  const pager = document.getElementById('pagination');
  const total = document.getElementById('totalLiveToken');
  const refreshBtn = document.getElementById('refreshList');

  function clean(s){
    return (s || '').replace(/\s+/g,' ').trim().toLowerCase();
  }

  function getStatusCell(row){
    const cells = row.querySelectorAll('td');
    return cells.length ? cells[cells.length - 1] : null;
  }

  function applyStatusColor(row){
    const cell = getStatusCell(row);
    if(!cell) return;

    cell.classList.remove(
      'status-not-there','status-rejected','status-all-pass',
      'status-approved','status-accepted','status-pending',
      'status-violate','status-violated'
    );

    const s = clean(cell.textContent);

    if(s.includes('not there')){
      cell.classList.add('status-not-there');
    }else if(s.includes('reject')){
      cell.classList.add('status-rejected');
    }else if(s.includes('all pass')){
      cell.classList.add('status-all-pass');
    }else if(s === 'approved' || s.includes('approved')){
      cell.classList.add('status-approved');
    }else if(s === 'accepted' || s.includes('accepted')){
      cell.classList.add('status-accepted');
    }else if(s.includes('pending')){
      cell.classList.add('status-pending');
    }else if(s.includes('violate')){
      cell.classList.add('status-violate');
    }
  }

  function collect(){
    rows = [...body.querySelectorAll('tr')].filter(row=>{
      const cells=row.querySelectorAll('td');
      const text=clean(row.textContent);
      return cells.length >= 3 && text && !text.includes('loading live data');
    });

    rows.forEach(applyStatusColor);
    if(total) total.textContent = rows.length;

    const pages = Math.max(1, Math.ceil(rows.length / PER_PAGE));
    if(currentPage > pages) currentPage = pages;
    render();
  }

  function render(){
    [...body.querySelectorAll('tr')].forEach(r=>r.style.display='none');

    const start=(currentPage-1)*PER_PAGE;
    rows.slice(start,start+PER_PAGE).forEach(r=>r.style.display='');

    const pageCount=Math.max(1,Math.ceil(rows.length/PER_PAGE));
    renderPager(pageCount);
  }

  function renderPager(pageCount){
    pager.innerHTML='';
    if(rows.length <= PER_PAGE) return;

    const prev=document.createElement('button');
    prev.innerHTML='<i class="fa-solid fa-chevron-left"></i>';
    prev.disabled=currentPage===1;
    prev.onclick=()=>{currentPage--;render();};
    pager.appendChild(prev);

    for(let i=1;i<=pageCount;i++){
      const b=document.createElement('button');
      b.textContent=i;
      if(i===currentPage)b.className='active';
      b.onclick=()=>{currentPage=i;render();};
      pager.appendChild(b);
    }

    const next=document.createElement('button');
    next.innerHTML='<i class="fa-solid fa-chevron-right"></i>';
    next.disabled=currentPage===pageCount;
    next.onclick=()=>{currentPage++;render();};
    pager.appendChild(next);

    const info=document.createElement('span');
    info.className='page-info';
    info.textContent='Page '+currentPage+' of '+pageCount;
    pager.appendChild(info);
  }

  // Refresh List: refreshes the page and reloads the live Sheet list.
  if(refreshBtn){
    refreshBtn.addEventListener('click',()=>{
      refreshBtn.classList.add('loading');
      location.reload();
    });
  }

  // Detect live updates made by script.js.
  const observer=new MutationObserver(()=>{
    setTimeout(collect,50);
  });
  observer.observe(body,{childList:true,subtree:true,characterData:true});

  setTimeout(collect,500);
  setInterval(collect,1500);
})();
</script>


<script>
(function(){
  const PER_PAGE = 15;
  let currentPage = 1;
  let rows = [];

  const body = document.getElementById('tableBody');
  const pager = document.getElementById('pagination');
  const total = document.getElementById('totalLiveToken');

  function cleanText(s){
    return (s || '').replace(/\s+/g,' ').trim().toLowerCase();
  }

  function statusClass(row){
    const cells = [...row.querySelectorAll('td')];
    const text = cleanText(cells.map(c=>c.textContent).join(' '));

    if(/not\s*there/.test(text)) return 'status-not-there';
    if(/reject|rejected/.test(text)) return 'status-rejected';
    if(/all\s*pass|all\s*passed/.test(text)) return 'status-all-pass';
    if(/\bapproved\b|\baccepted\b/.test(text)) return 'status-approved';
    if(/\bpending\b/.test(text)) return 'status-pending';
    if(/violate|violated|violation/.test(text)) return 'status-violate';
    return '';
  }

  function isDataRow(row){
    if(!row) return false;
    const cells = row.querySelectorAll('td');
    if(!cells.length) return false;
    const txt = cleanText(row.textContent);
    return txt && !/loading live data/.test(txt) && cells.length >= 1;
  }

  function collectRows(){
    rows = [...body.querySelectorAll('tr')].filter(isDataRow);

    rows.forEach(row=>{
      row.classList.remove(
        'status-not-there','status-rejected','status-all-pass',
        'status-approved','status-accepted','status-pending',
        'status-violate','status-violated'
      );
      const cls = statusClass(row);
      if(cls) row.classList.add(cls);
    });

    if(total) total.textContent = rows.length;
    const pages = Math.max(1, Math.ceil(rows.length / PER_PAGE));
    if(currentPage > pages) currentPage = pages;
    renderPage();
  }

  function renderPage(){
    [...body.querySelectorAll('tr')].forEach(r=>r.style.display='none');

    const start = (currentPage-1)*PER_PAGE;
    rows.slice(start,start+PER_PAGE).forEach(r=>r.style.display='');

    renderPagination(Math.max(1,Math.ceil(rows.length/PER_PAGE)));
  }

  function renderPagination(pageCount){
    if(!pager) return;
    pager.innerHTML = '';

    if(rows.length <= PER_PAGE) return;

    const prev = document.createElement('button');
    prev.innerHTML = '<i class="fa-solid fa-chevron-left"></i>';
    prev.disabled = currentPage === 1;
    prev.onclick = ()=>{currentPage--;renderPage()};
    pager.appendChild(prev);

    for(let i=1;i<=pageCount;i++){
      const b=document.createElement('button');
      b.textContent=i;
      b.className=i===currentPage?'active':'';
      b.onclick=()=>{currentPage=i;renderPage()};
      pager.appendChild(b);
    }

    const next=document.createElement('button');
    next.innerHTML = '<i class="fa-solid fa-chevron-right"></i>';
    next.disabled = currentPage === pageCount;
    next.onclick = ()=>{currentPage++;renderPage()};
    pager.appendChild(next);

    const info=document.createElement('span');
    info.className='page-info';
    info.textContent='Page '+currentPage+' of '+pageCount;
    pager.appendChild(info);
  }

  // Re-run whenever script.js updates the Google Sheet token list.
  const observer = new MutationObserver(()=>setTimeout(collectRows,40));
  observer.observe(body,{childList:true,subtree:true,characterData:true});

  // Initial + periodic refresh for compatibility with live Sheet updates.
  setTimeout(collectRows,500);
  setInterval(collectRows,1500);
})();
</script>
