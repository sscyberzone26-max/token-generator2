<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>SS CYBER ZONE | Smart Token System</title>

<link rel="preconnect" href="https://fonts.googleapis.com">

<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"/>

<link rel="stylesheet" href="style.css">

</head>

<body>

<div class="background"></div>

<div class="overlay"></div>

<div class="container">

<!-- ================= HEADER ================= -->

<header>

<div class="logoSection">

<h1>

SS CYBER ZONE

</h1>

<p>

Smart Token System

</p>

<div class="live">

<span></span>

LIVE

</div>

</div>

<div class="dateTime">

<div class="dateBox">

<i class="fa-solid fa-calendar-days"></i>

<span id="date"></span>

</div>

<div class="timeBox">

<i class="fa-solid fa-clock"></i>

<span id="time"></span>

</div>

</div>

</header>

<!-- ================= TITLE ================= -->

<div class="title">

<h2>

LIVE TOKEN LIST

</h2>

<p>

Real-time Google Sheet Connected

</p>

</div>

<!-- ================= BUTTON ================= -->

<div class="buttonArea">

<a

href="https://sscyberzone26-max.github.io/token-generator2/"

target="_blank"

class="btn primary">

<i class="fa-solid fa-ticket"></i>

Get a New Token Number

</a>

<button

id="showQR"

class="btn secondary">

<i class="fa-solid fa-qrcode"></i>

Show QR

</button>

</div>

<!-- ================= SEARCH ================= -->

<div class="searchBox">

<input

type="text"

id="search"

placeholder="Search Token / Name...">

</div>

<!-- ================= COUNTER ================= -->

<div class="counter">

Total Live Token :

<span id="totalToken">

0

</span>

</div>

<!-- ================= TABLE ================= -->

<div class="tableContainer">

<table>

<thead>

<tr>

<th>

Token

</th>

<th>

Name

</th>

<th>

Our Status

</th>

</tr>

</thead>

<tbody id="tableBody">

<tr>

<td colspan="3">

Loading...

</td>

</tr>

</tbody>

</table>

</div>

<!-- ================= FOOTER ================= -->

<footer>

<i class="fa-solid fa-bolt"></i>

Powered By

<b>

SS CYBER ZONE

</b>

</footer>

</div>

<!-- ================= QR MODAL ================= -->

<div

class="modal"

id="qrModal">

<div class="modalBox">

<span

id="closeQR"

class="close">

×

</span>

<h2>

Scan QR

</h2>

<img

src="qr.png"

class="qrImage"

alt="QR">

<a

href="qr.png"

download

class="download">

<i class="fa-solid fa-download"></i>

Download QR

</a>

</div>

</div>

<script src="script.js"></script>

</body>
</html>
