<script src="script.js"></script>

<script>
(function () {
  const ROWS_PER_PAGE = 25;
  const tbody = document.getElementById("tableBody");
  const pagination = document.getElementById("pagination");
  const search = document.getElementById("search");
  let currentPage = 1;
  let lastSignature = "";

  function getRows() {
    return Array.from(tbody.querySelectorAll("tr")).filter(tr => {
      const cells = tr.querySelectorAll("td");
      return cells.length >= 3 && !/loading/i.test(tr.textContent.trim());
    });
  }

  function signature(rows) {
    return rows.map(r => r.innerText.trim()).join("||");
  }

  function renderPagination(totalPages) {
    pagination.innerHTML = "";
    if (totalPages <= 1) return;

    const prev = document.createElement("button");
    prev.textContent = "‹";
    prev.title = "Previous";
    prev.disabled = currentPage === 1;
    prev.onclick = () => { currentPage--; update(true); };
    pagination.appendChild(prev);

    for (let i = 1; i <= totalPages; i++) {
      const btn = document.createElement("button");
      btn.textContent = i;
      btn.className = i === currentPage ? "active" : "";
      btn.onclick = () => { currentPage = i; update(true); };
      pagination.appendChild(btn);
    }

    const next = document.createElement("button");
    next.textContent = "›";
    next.title = "Next";
    next.disabled = currentPage === totalPages;
    next.onclick = () => { currentPage++; update(true); };
    pagination.appendChild(next);

    const info = document.createElement("span");
    info.className = "pageInfo";
    info.textContent = "Page " + currentPage + " / " + totalPages;
    pagination.appendChild(info);
  }

  function update(force) {
    let rows = getRows();
    const sig = signature(rows);
    if (!force && sig === lastSignature) return;

    // Keep search working with pagination.
    const query = (search?.value || "").trim().toLowerCase();
    if (query) {
      rows = rows.filter(row => row.innerText.toLowerCase().includes(query));
    }

    const totalPages = Math.max(1, Math.ceil(rows.length / ROWS_PER_PAGE));
    if (currentPage > totalPages) currentPage = totalPages;

    // Hide all currently available rows, then show only this page.
    getRows().forEach(row => row.style.display = "none");
    const start = (currentPage - 1) * ROWS_PER_PAGE;
    rows.slice(start, start + ROWS_PER_PAGE).forEach(row => row.style.display = "");

    renderPagination(totalPages);
    lastSignature = sig;
  }

  // Search input: reset to page 1 when search text changes.
  if (search) {
    search.addEventListener("input", () => {
      currentPage = 1;
      lastSignature = "";
      update(true);
    });
  }

  // script.js may load/update rows later, so watch the table.
  const observer = new MutationObserver(() => {
    currentPage = Math.min(currentPage, Math.max(1, Math.ceil(getRows().length / ROWS_PER_PAGE)));
    lastSignature = "";
    update(true);
  });
  observer.observe(tbody, { childList: true, subtree: true });

  // Initial + periodic refresh for data loaded asynchronously.
  update(true);
  setInterval(() => update(false), 1000);
})();
</script>
